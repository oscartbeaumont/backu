name: TestFlight

# Manual, ad-hoc TestFlight upload. For a versioned release (version bump, tag
# and GitHub Release) use the Release workflow instead.
#
# Requires the App Store Connect app record to exist, plus these repository
# secrets:
#   APPLE_TEAM_ID       Apple Developer team ID
#   ASC_KEY_ID          App Store Connect API key ID (Admin role)
#   ASC_ISSUER_ID       App Store Connect issuer ID
#   ASC_PRIVATE_KEY     the AuthKey_<id>.p8 contents
#
# The API key needs the Admin role so xcodebuild can create the cloud-managed
# distribution certificate and profile. It is used for signing and uploading.
# (altool). No certificate or profile secrets are required.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (optional; defaults to a UTC timestamp)
        required: false
        default: ""
      marketing_version:
        description: Marketing version (optional; defaults to project.yml)
        required: false
        default: ""
      platform:
        description: Platform to publish
        type: choice
        options:
          - ios
          - macos
        default: ios

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then echo "missing secret $name"; missing=1; fi
          done
          exit $missing

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compute build number
        id: build
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
        run: |
          if [ -n "$INPUT_BUILD" ]; then
            echo "number=$INPUT_BUILD" >> "$GITHUB_OUTPUT"
          else
            echo "number=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Write App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive, export and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          PLATFORM: ${{ inputs.platform || 'ios' }}
        run: ./scripts/testflight.sh

      - name: Add build to TestFlight group
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          BUNDLE_ID: me.otbeaumont.backu
          TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_GROUP || 'Internal' }}
          PLATFORM: ${{ inputs.platform || 'ios' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" scripts/testflight-group.py \
            --key-path "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$BUNDLE_ID" \
            --build-number "$BUILD_NUMBER" \
            --group "$TESTFLIGHT_GROUP" \
            --platform "$PLATFORM"
