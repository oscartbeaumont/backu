name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-s3:
    name: S3 mock + signature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run all stdlib S3 server tests
        run: python3 -m unittest discover -s Tools/MockS3 -p 'test_*.py' -v

  build:
    name: Build iOS + macOS
    # Apple requires the iOS 27 SDK (ITMS-90725). macos-latest still ships
    # Xcode 26.x, so build on the image that carries Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: Build for iOS
        run: |
          xcodebuild -project Backu.xcodeproj -scheme Backu \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build for macOS
        run: |
          xcodebuild -project Backu.xcodeproj -scheme Backu \
            -destination 'platform=macOS' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

  landing:
    name: Build landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
