name: Deploy landing

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload preview version
        id: preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx wrangler versions upload \
            --preview-alias "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER" \
            | tee "$RUNNER_TEMP/preview.log"
          url="$(sed -n 's/^Version Preview Alias URL: //p' "$RUNNER_TEMP/preview.log" | head -1 | tr -d '\r')"
          if [ -z "$url" ]; then
            url="$(sed -n 's/^Version Preview URL: //p' "$RUNNER_TEMP/preview.log" | head -1 | tr -d '\r')"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "Preview deployed: ${{ steps.preview.outputs.url }}"
      - name: Cloudflare token missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Add a CLOUDFLARE_API_TOKEN repository secret to deploy PR previews."

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Cloudflare token missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Add a CLOUDFLARE_API_TOKEN repository secret to deploy on push."
