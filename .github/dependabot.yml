version: 2

# Backu has no third-party packages today: everything ships from the SDK and the
# S3 client is hand-rolled. Keeping the grouped Actions updates wired up means
# bumping checkout/setup-python arrives as one reviewable PR instead of a stream.
multi-ecosystem-groups:
  backu-deps:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Australia/Sydney"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "backu-deps"
    patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"

